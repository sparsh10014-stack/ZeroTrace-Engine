<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTrace - Security Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* =========================
           MAIN SCREEN
        ========================= */

        .verification-screen {
            width: 243px;
            height: 526px;

            position: relative;

            background: linear-gradient(
                180deg,
                #061525 0%,
                #0b2149 55%,
                #173a7c 100%
            );

            color: white;
            overflow: hidden;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 13px;
        }

        .brand {
            font-size: 11px;
            font-weight: 600;
        }

        /* =========================
           BELL - CSS ONLY
        ========================= */

        .bell {
            width: 18px;
            height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .bell-icon {
            width: 10px;
            height: 11px;

            border: 1.5px solid white;

            border-radius: 6px 6px 2px 2px;

            position: relative;
        }

        .bell-icon::before {
            content: "";

            position: absolute;

            width: 13px;
            height: 1.5px;

            background: white;

            left: -3px;
            bottom: -2px;

            border-radius: 2px;
        }

        .bell-icon::after {
            content: "";

            position: absolute;

            width: 3px;
            height: 3px;

            background: white;

            border-radius: 50%;

            left: 2px;
            bottom: -5px;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            position: absolute;

            top: 74px;
            left: 0;

            width: 100%;

            text-align: center;
        }

        .content h1 {
            margin: 0;

            font-size: 15px;
            font-weight: 700;
        }

        .subtitle {
            width: 150px;

            margin: 10px auto 0;

            text-align: left;

            font-size: 9px;
            line-height: 14px;

            color: #8994a9;
        }

        /* =========================
           OTP INPUTS
        ========================= */

        .otp-list {
            margin-top: 34px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .otp-box {
            width: 224px;
            height: 40px;

            margin-bottom: 27px;

            border: none;
            border-radius: 9px;

            background: white;

            display: flex;
            align-items: center;

            padding-left: 12px;

            color: #687993;
        }

        .otp-icon {
            width: 24px;

            margin-right: 6px;

            font-size: 13px;

            text-align: center;
        }

        .otp-box input {
            width: 170px;

            border: none;
            outline: none;

            background: transparent;

            font-size: 12px;
            font-weight: 600;

            color: #687993;
        }

        .otp-box input::placeholder {
            color: #687993;
            opacity: 1;
        }

        /* =========================
           CONTINUE BUTTON
        ========================= */

        .continue-btn {
            width: 90px;
            height: 25px;

            margin-top: 4px;

            border: none;
            border-radius: 3px;

            background: #d9dce1;

            color: #111;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }

        .continue-btn:hover {
            background: white;
        }

        /* =========================
           BOTTOM NAVIGATION
        ========================= */

        .bottom-nav {
            position: absolute;

            left: 20px;
            right: 10px;
            bottom: 12px;

            height: 40px;

            background: #102b59;

            border-radius: 12px;

            display: flex;

            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            width: 40px;
            height: 34px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            color: #dce4f2;

            font-size: 11px;

            cursor: pointer;

            position: relative;
        }

        .nav-item span {
            font-size: 6px;

            margin-top: 2px;

            line-height: 7px;
        }

        .nav-item.active {
            color: white;
        }

    </style>
</head>

<body>

    <div class="verification-screen">

        <!-- =========================
             HEADER
        ========================= -->

        <div class="header">

            <div class="brand">
                ZeroTrace
            </div>

            <!-- CSS Bell -->

            <div class="bell">
                <div class="bell-icon"></div>
            </div>

        </div>


        <!-- =========================
             CONTENT
        ========================= -->

        <div class="content">

            <h1>
                Security Verification
            </h1>

            <p class="subtitle">
                Verify your identity to keep your<br>
                account secure
            </p>


            <!-- =========================
                 OTP INPUTS
            ========================= -->

            <div class="otp-list">

                <!-- 6 Digit OTP -->

                <div class="otp-box">

                    <span class="otp-icon">🛡️</span>

                    <input
                        type="text"
                        maxlength="6"
                        placeholder="Enter 6 digit OTP"
                    >

                </div>


                <!-- Email OTP -->

                <div class="otp-box">

                    <span class="otp-icon">✉</span>

                    <input
                        type="text"
                        placeholder="Enter Email OTP"
                    >

                </div>


                <!-- SMS OTP -->

                <div class="otp-box">

                    <span class="otp-icon">📱</span>

                    <input
                        type="text"
                        placeholder="Enter SMS OTP"
                    >

                </div>

            </div>


            <!-- Continue -->

            <button class="continue-btn">
                Continue→
            </button>

        </div>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================= -->

        <div class="bottom-nav">

            <!-- Home -->

            <div class="nav-item">
                🏠
            </div>


            <!-- Security -->

            <div class="nav-item">
                🛡️
            </div>


            <!-- Verification -->

            <div class="nav-item">
                👁️
            </div>


            <!-- Settings -->

            <div class="nav-item active">
                ⚙️
                <span>Settings</span>
            </div>

        </div>

    </div>

</body>
</html>
