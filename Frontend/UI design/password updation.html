
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZeroTrace Password Updation</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f2f2;
    font-family:Arial,sans-serif;
}

/* MAIN SCREEN */

.password-screen{
    width:243px;
    height:526px;
    position:relative;
    overflow:hidden;
    color:white;

    background:linear-gradient(
        180deg,
        #061525 0%,
        #0b2149 55%,
        #173a7c 100%
    );
}

/* HEADER */

.header{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 13px;
}

.brand{
    font-size:11px;
    font-weight:600;
}

/* CSS BELL */

.bell{
    width:18px;
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.bell-icon{
    width:10px;
    height:11px;
    border:1.5px solid white;
    border-radius:6px 6px 2px 2px;
    position:relative;
}

.bell-icon::before{
    content:"";
    position:absolute;
    width:13px;
    height:1.5px;
    background:white;
    left:-3px;
    bottom:-2px;
    border-radius:2px;
}

.bell-icon::after{
    content:"";
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    left:2px;
    bottom:-5px;
}

/* CONTENT */

.content{
    position:absolute;
    top:72px;
    left:0;
    width:100%;
    text-align:center;
}

.content h1{
    margin:0;
    font-size:16px;
    font-weight:700;
}

.subtitle{
    margin-top:10px;
    font-size:9px;
    color:#a8b0c0;
}

/* PASSWORD LIST */

.password-list{
    margin-top:52px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.password-box{
    width:224px;
    height:40px;
    margin-bottom:27px;
    border:none;
    border-radius:9px;
    background:#f2f2f2;
    display:flex;
    align-items:center;
    padding-left:42px;
}

.password-box .key{
    width:28px;
    margin-right:8px;
    font-size:14px;
    color:#7a8799;
}

.password-box input{
    border:none;
    outline:none;
    background:transparent;
    width:140px;
    font-size:12px;
    font-weight:600;
    color:#687993;
}

.password-box input::placeholder{
    color:#687993;
    opacity:1;
}

/* BUTTON */

.continue-btn{
    width:90px;
    height:29px;
    border:none;
    border-radius:4px;
    background:#d9dce1;
    color:#34445c;
    font-size:12px;
    font-weight:600;
    margin-top:3px;
    cursor:pointer;
}

/* BOTTOM NAV */

.bottom-nav{
    position:absolute;
    left:20px;
    right:10px;
    bottom:12px;
    height:40px;
    background:#102b59;
    border-radius:12px;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-item{
    width:40px;
    height:34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#dce4f2;
    font-size:11px;
}

.nav-item span{
    font-size:6px;
    margin-top:2px;
}

.nav-item.active{
    color:white;
}

</style>
</head>

<body>

<div class="password-screen">

    <!-- HEADER -->

    <div class="header">

        <div class="brand">
            ZeroTrace
        </div>

        <div class="bell">
            <div class="bell-icon"></div>
        </div>

    </div>


    <!-- CONTENT -->

    <div class="content">

        <h1>Password Updation</h1>

        <p class="subtitle">
            manage your password securely
        </p>


        <div class="password-list">

            <!-- Current Password -->

            <div class="password-box">
                <span class="key">🔑</span>
                <input type="password" placeholder="Current Password">
            </div>


            <!-- New Password -->

            <div class="password-box">
                <span class="key">🔑</span>
                <input type="password" placeholder="New Password">
            </div>


            <!-- Confirm Password -->

            <div class="password-box">
                <span class="key">🔑</span>
                <input type="password" placeholder="Confirm new Password">
            </div>

        </div>


        <button class="continue-btn">
            Continue→
        </button>

    </div>


    <!-- BOTTOM NAVIGATION -->

    <div class="bottom-nav">

        <div class="nav-item">
            🏠
        </div>

        <div class="nav-item">
            🛡️
        </div>

        <div class="nav-item">
            👁️
        </div>

        <div class="nav-item active">
            ⚙️
            <span>Settings</span>
        </div>

    </div>

</div>

</body>
</html>
