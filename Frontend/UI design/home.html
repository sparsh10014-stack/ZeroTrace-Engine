<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTrace Home</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* =========================
           MAIN HOME SCREEN
        ========================= */

        .home-screen {
            width: 245px;
            height: 528px;
            position: relative;

            background: linear-gradient(
                180deg,
                #061525 0%,
                #0b2149 55%,
                #173a7c 100%
            );

            color: white;
            overflow: hidden;
        }


        /* =========================
           TOP HEADER
        ========================= */

        .header {
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 13px;
        }

        .brand {
            font-size: 12px;
            font-weight: 500;
        }

        /* Proper Bell Icon */
        .bell {
            width: 18px;
            height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .bell svg {
            width: 16px;
            height: 16px;
        }


        /* =========================
           CENTER CONTENT
        ========================= */

        .content {
            position: absolute;

            top: 198px;
            left: 0;

            width: 100%;

            text-align: center;
        }


        /* =========================
           SHIELD
        ========================= */

        .shield {
            width: 74px;
            height: 82px;

            margin: 0 auto 20px;

            background: linear-gradient(
                145deg,
                #ffffff,
                #c8cbd0
            );

            clip-path: polygon(
                50% 0%,
                67% 9%,
                84% 4%,
                100% 20%,
                91% 43%,
                100% 68%,
                88% 82%,
                68% 92%,
                50% 100%,
                32% 92%,
                12% 82%,
                0% 68%,
                9% 43%,
                0% 20%,
                16% 4%,
                33% 9%
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* Lock inside shield */

        .lock {
            width: 14px;
            height: 13px;

            background: white;

            border-radius: 2px;

            position: relative;
        }

        .lock::before {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            border: 2px solid white;
            border-bottom: none;

            border-radius: 7px 7px 0 0;

            left: 1px;
            top: -7px;
        }


        /* =========================
           TEXT
        ========================= */

        .content h1 {
            margin: 0;

            font-size: 15px;
            font-weight: 700;
        }

        .subtitle {
            margin: 5px 0 0;

            font-size: 9px;
            color: #e2e6ee;
        }

        .tagline {
            margin: 11px 0 16px;

            font-size: 9px;
            color: #bdc7da;
        }


        /* =========================
           GET STARTED BUTTON
        ========================= */

        .get-started {
            width: 174px;
            height: 30px;

            border: none;
            border-radius: 7px;

            background: #d9dce1;
            color: #07172e;

            font-size: 10px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .get-started:hover {
            background: white;
            transform: translateY(-1px);
        }


        /* =========================
           BOTTOM NAVIGATION
        ========================= */

        .bottom-nav {
            position: absolute;

            left: 21px;
            right: 11px;
            bottom: 12px;

            height: 40px;

            background: #102b59;

            border-radius: 12px;

            display: flex;
            justify-content: space-around;
            align-items: center;
        }


        /* Navigation Items */

        .nav-item {
            width: 40px;
            height: 34px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            color: #dce4f2;

            font-size: 12px;

            cursor: pointer;

            position: relative;
        }

        .nav-item span {
            font-size: 7px;
            margin-top: 2px;
        }


        /* Active Home */

        .nav-item.active {
            color: white;
        }

        .nav-item.active::before {
            content: "";

            position: absolute;

            top: -1px;

            width: 8px;
            height: 2px;

            background: #9b5cff;

            border-radius: 5px;
        }

    </style>
</head>


<body>

    <div class="home-screen">


        <!-- =========================
             HEADER
        ========================== -->

        <div class="header">

            <div class="brand">
                ZeroTrace
            </div>


            <!-- Bell Icon -->

            <div class="bell">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M18 9C18 5.69 15.76 3 12 3C8.24 3 6 5.69 6 9C6 14 4 15 4 17H20C20 15 18 14 18 9Z"
                        stroke="white"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M10 20H14"
                        stroke="white"
                        stroke-width="1.7"
                        stroke-linecap="round"
                    />

                </svg>

            </div>

        </div>



        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <div class="content">


            <!-- Shield -->

            <div class="shield">

                <div class="lock"></div>

            </div>


            <!-- Heading -->

            <h1>
                Welcome to Zero Trace
            </h1>


            <!-- Subtitle -->

            <p class="subtitle">
                Ready to protect your digital world?
            </p>


            <!-- Tagline -->

            <p class="tagline">
                Your security, simplified
            </p>


            <!-- Button -->

            <button class="get-started">
                Get Started →
            </button>

        </div>



        <!-- =========================
             BOTTOM NAVIGATION
        ========================== -->

        <div class="bottom-nav">


            <!-- Home -->

            <div class="nav-item active">

                🏠

                <span>
                    Home
                </span>

            </div>


            <!-- Security -->

            <div class="nav-item">

                🛡️

            </div>


            <!-- Verification -->

            <div class="nav-item">

                👁️

            </div>


            <!-- Settings -->

            <div class="nav-item">

                ⚙️

            </div>


        </div>

    </div>

</body>
</html>
