<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Success</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .success-circle {
            width: 430px;
            height: 430px;
            border: 22px solid #00a94f;
            border-radius: 50%;
            background: white;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* Inner green ring */
        .success-circle::before {
            content: "";
            position: absolute;
            width: 355px;
            height: 355px;
            border: 20px solid #20c55a;
            border-radius: 50%;
        }

        /* Check mark */
        .checkmark {
            position: relative;
            z-index: 2;

            width: 125px;
            height: 210px;

            border-right: 24px solid #20c55a;
            border-bottom: 24px solid #20c55a;

            transform: rotate(40deg);

            margin-top: -55px;
            margin-left: -20px;

            border-radius: 0 0 10px 0;
        }
    </style>
</head>

<body>

    <div class="success-circle">
        <div class="checkmark"></div>
    </div>

</body>
</html>
