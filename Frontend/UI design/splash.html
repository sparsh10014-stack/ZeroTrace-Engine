<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTrace - Splash Screen</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* Splash Screen */
        .splash-screen {
            width: 243px;
            height: 526px;

            background: linear-gradient(
                180deg,
                #061526 0%,
                #0b2149 55%,
                #173878 100%
            );

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Verification icon area */
        .verification-icon {
            width: 106px;
            height: 106px;
            border: 2px solid white;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            /* Green glow */
            box-shadow:
                0 0 15px rgba(32, 197, 90, 0.45),
                0 0 35px rgba(32, 197, 90, 0.35),
                0 0 65px rgba(32, 197, 90, 0.25);
        }

        /* Inner circle */
        .verification-icon::before {
            content: "";
            position: absolute;

            width: 88px;
            height: 88px;

            border: 2px solid white;
            border-radius: 50%;
        }

        /* Check mark */
        .check {
            width: 43px;
            height: 25px;

            border-left: 7px solid white;
            border-bottom: 7px solid white;

            transform: rotate(-45deg);

            position: relative;
            z-index: 2;

            margin-top: -8px;
            margin-left: 3px;

            border-radius: 3px;
        }

        /* Logo */
        .logo {
            margin-top: 18px;

            font-size: 29px;
            font-weight: 800;
            letter-spacing: -1.2px;
        }

        .zero {
            color: white;
        }

        .trace {
            color: #20c55a;
        }
    </style>
</head>

<body>

    <div class="splash-screen">

        <!-- Verification Icon -->
        <div class="verification-icon">
            <div class="check"></div>
        </div>

        <!-- ZeroTrace Logo -->
        <div class="logo">
            <span class="zero">Zero</span><span class="trace">Trace</span>
        </div>

    </div>

</body>
</html>
