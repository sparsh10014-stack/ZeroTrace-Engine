<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZeroTrace - Verification Complete</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }


        /* =========================
           MAIN SCREEN
        ========================= */

        .complete-screen {
            width: 243px;
            height: 526px;

            position: relative;

            background: linear-gradient(
                180deg,
                #061525 0%,
                #0b2149 55%,
                #173a7c 100%
            );

            color: white;
            overflow: hidden;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 13px;
        }

        .brand {
            font-size: 11px;
            font-weight: 600;
        }


        /* =========================
           BELL ICON
        ========================= */

        .bell {
            width: 18px;
            height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .bell-icon {
            width: 10px;
            height: 11px;

            border: 1.5px solid white;

            border-radius: 6px 6px 2px 2px;

            position: relative;
        }

        .bell-icon::before {
            content: "";

            position: absolute;

            width: 13px;
            height: 1.5px;

            background: white;

            left: -3px;
            bottom: -2px;

            border-radius: 2px;
        }

        .bell-icon::after {
            content: "";

            position: absolute;

            width: 3px;
            height: 3px;

            background: white;

            border-radius: 50%;

            left: 2px;
            bottom: -5px;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {
            position: absolute;

            top: 50px;
            left: 0;

            width: 100%;

            text-align: center;
        }


        /* =========================
           SUCCESS CIRCLE
        ========================= */

        .success-circle {
            width: 118px;
            height: 118px;

            margin: 0 auto;

            border-radius: 50%;

            background: rgba(9, 105, 61, 0.35);

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }


        .success-circle::before {
            content: "";

            position: absolute;

            width: 94px;
            height: 94px;

            border-radius: 50%;

            border: 1px solid #168b54;

            background: rgba(7, 71, 42, 0.25);
        }


        /* =========================
           SHIELD
        ========================= */

        .shield {
            width: 50px;
            height: 56px;

            position: relative;

            z-index: 2;

            background: white;

            clip-path: polygon(
                50% 0%,
                64% 7%,
                78% 4%,
                92% 12%,
                100% 20%,
                94% 55%,
                82% 78%,
                66% 91%,
                50% 100%,
                34% 91%,
                18% 78%,
                6% 55%,
                0% 20%,
                8% 12%,
                22% 4%,
                36% 7%
            );
        }


        /* Green inner shield */

        .shield::after {
            content: "";

            position: absolute;

            left: 4px;
            top: 4px;

            width: 42px;
            height: 48px;

            background: #008c18;

            clip-path: polygon(
                50% 0%,
                64% 7%,
                78% 4%,
                92% 12%,
                100% 20%,
                94% 55%,
                82% 78%,
                66% 91%,
                50% 100%,
                34% 91%,
                18% 78%,
                6% 55%,
                0% 20%,
                8% 12%,
                22% 4%,
                36% 7%
            );
        }


        /* =========================
           SUCCESS TEXT
        ========================= */

        .success-title {
            margin-top: 18px;

            font-size: 16px;

            font-weight: 700;
        }


        .success-message {
            margin-top: 5px;

            font-size: 9px;

            color: #dce2ec;

            text-decoration: underline;
        }

    </style>
</head>


<body>


    <div class="complete-screen">


        <!-- =========================
             HEADER
        ========================= -->

        <div class="header">

            <div class="brand">
                ZeroTrace
            </div>

            <div class="bell">
                <div class="bell-icon"></div>
            </div>

        </div>


        <!-- =========================
             MAIN CONTENT
        ========================= -->

        <div class="content">


            <!-- SUCCESS CIRCLE -->

            <div class="success-circle">

                <div class="shield"></div>

            </div>


            <!-- SUCCESS TITLE -->

            <div class="success-title">
                Verification Complete
            </div>


            <!-- SUCCESS MESSAGE -->

            <div class="success-message">
                your proof has been successfully verified
            </div>


        </div>


    </div>


</body>
</html>
