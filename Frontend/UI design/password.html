<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTrace - Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* =========================
           PASSWORD SCREEN
        ========================= */

        .password-screen {
            width: 243px;
            height: 526px;

            position: relative;

            background: linear-gradient(
                180deg,
                #061525 0%,
                #0b2149 55%,
                #173a7c 100%
            );

            color: white;
            overflow: hidden;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 13px;
        }

        .brand {
            font-size: 11px;
            font-weight: 600;
        }

        /* =========================
           CSS BELL ICON
        ========================= */

        .bell {
            width: 18px;
            height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bell-icon {
            width: 10px;
            height: 11px;

            border: 1.5px solid white;

            border-radius: 6px 6px 2px 2px;

            position: relative;
        }

        /* Bell bottom */

        .bell-icon::before {
            content: "";

            position: absolute;

            width: 13px;
            height: 1.5px;

            background: white;

            left: -3px;
            bottom: -2px;

            border-radius: 2px;
        }

        /* Bell clapper */

        .bell-icon::after {
            content: "";

            position: absolute;

            width: 3px;
            height: 3px;

            background: white;

            border-radius: 50%;

            left: 2px;
            bottom: -5px;
        }

        /* =========================
           PASSWORD CONTENT
        ========================= */

        .content {
            position: absolute;

            top: 88px;
            left: 0;

            width: 100%;

            text-align: center;
        }

        .content h1 {
            margin: 0 0 31px;

            font-size: 15px;
            font-weight: 700;
        }

        /* =========================
           PASSWORD INPUT
        ========================= */

        .password-box {
            width: 224px;
            height: 40px;

            margin: 0 auto;

            border: none;
            border-radius: 9px;

            background: white;

            display: flex;
            align-items: center;

            padding: 0 16px;

            color: #687993;
        }

        .password-box .icon {
            width: 20px;

            font-size: 10px;

            color: #687993;
        }

        .password-box input {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            text-align: center;

            color: #687993;

            font-size: 12px;
            font-weight: 600;
        }

        .password-box input::placeholder {
            color: #687993;
            opacity: 1;
        }

        /* =========================
           DESCRIPTION
        ========================= */

        .description {
            margin: 15px 0 0;

            font-size: 9px;

            color: white;

            font-weight: 600;
        }

        /* =========================
           CONTINUE BUTTON
        ========================= */

        .continue-btn {
            width: 112px;
            height: 23px;

            margin-top: 23px;

            border: none;
            border-radius: 5px;

            background: #d9dce1;

            color: #687993;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }

        .continue-btn:hover {
            background: white;
        }

        /* =========================
           FORGOT PASSWORD
        ========================= */

        .forgot {
            margin-top: 6px;

            font-size: 8px;

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        /* =========================
           BOTTOM NAVIGATION
        ========================= */

        .bottom-nav {
            position: absolute;

            left: 20px;
            right: 10px;
            bottom: 12px;

            height: 40px;

            background: #102b59;

            border-radius: 12px;

            display: flex;

            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            width: 40px;
            height: 34px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            color: #dce4f2;

            font-size: 11px;

            cursor: pointer;

            position: relative;
        }

        .nav-item span {
            font-size: 6px;

            margin-top: 2px;

            line-height: 7px;
        }

        /* Settings */

        .nav-item.active {
            color: white;
        }
    </style>
</head>

<body>

    <div class="password-screen">

        <!-- =========================
             HEADER
        ========================= -->

        <div class="header">

            <div class="brand">
                ZeroTrace
            </div>

            <!-- CSS Bell -->

            <div class="bell">
                <div class="bell-icon"></div>
            </div>

        </div>


        <!-- =========================
             PASSWORD CONTENT
        ========================= -->

        <div class="content">

            <h1>
                Password
            </h1>


            <!-- Password Input -->

            <div class="password-box">

                <span class="icon">•</span>

                <input
                    type="password"
                    placeholder="Enter Password"
                >

            </div>


            <!-- Description -->

            <p class="description">
                Enter your password to continue securely
            </p>


            <!-- Continue Button -->

            <button class="continue-btn">
                Continue
            </button>


            <!-- Forgot Password -->

            <div class="forgot">
                forgot password ?
            </div>

        </div>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================= -->

        <div class="bottom-nav">

            <!-- Home -->

            <div class="nav-item">
                🏠
            </div>


            <!-- Security -->

            <div class="nav-item">
                🛡️
            </div>


            <!-- Verification -->

            <div class="nav-item">
                👁️
            </div>


            <!-- Settings -->

            <div class="nav-item">
                ⚙️
                <span>Settings</span>
            </div>

        </div>

    </div>

</body>
</html>
