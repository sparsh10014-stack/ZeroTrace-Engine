<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZeroTrace - Verification</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }


        /* =========================
           MAIN SCREEN
        ========================= */

        .verification-screen {
            width: 243px;
            height: 526px;

            position: relative;

            background: linear-gradient(
                180deg,
                #061525 0%,
                #0b2149 55%,
                #173a7c 100%
            );

            color: white;

            overflow: hidden;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 13px;
        }

        .brand {
            font-size: 11px;
            font-weight: 600;
        }


        /* =========================
           CSS BELL
        ========================= */

        .bell {
            width: 18px;
            height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bell-icon {
            width: 10px;
            height: 11px;

            border: 1.5px solid white;

            border-radius: 6px 6px 2px 2px;

            position: relative;
        }

        .bell-icon::before {
            content: "";

            position: absolute;

            width: 13px;
            height: 1.5px;

            background: white;

            left: -3px;
            bottom: -2px;

            border-radius: 2px;
        }

        .bell-icon::after {
            content: "";

            position: absolute;

            width: 3px;
            height: 3px;

            background: white;

            border-radius: 50%;

            left: 2px;
            bottom: -5px;
        }


        /* =========================
           PAGE TITLE
        ========================= */

        .title-section {
            text-align: center;

            margin-top: 37px;
        }

        .title-section h1 {
            margin: 0;

            font-size: 16px;
            font-weight: 700;
        }

        .title-section p {
            margin: 5px 0 0;

            font-size: 9px;

            color: #8994a9;
        }


        /* =========================
           VERIFICATION CARD
        ========================= */

        .verification-card {
            position: absolute;

            top: 137px;
            left: 19px;

            width: 211px;
            height: 350px;

            background: #d9d9d9;

            border-radius: 11px;

            color: #111;

            padding: 35px 13px 10px;
        }


        /* =========================
           SHIELD
        ========================= */

        .shield {
            position: absolute;

            top: 6px;
            left: 50%;

            transform: translateX(-50%);

            width: 27px;
            height: 29px;

            background: linear-gradient(
                180deg,
                #061525,
                #1d8ee8
            );

            clip-path: polygon(
                50% 0%,
                90% 15%,
                85% 65%,
                50% 100%,
                15% 65%,
                10% 15%
            );
        }


        /* =========================
           CARD TITLE
        ========================= */

        .card-title {
            text-align: left;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 10px;
        }

        .card-description {
            text-align: left;

            font-size: 8px;

            line-height: 12px;

            margin: 0 0 12px;
        }


        /* =========================
           LINE
        ========================= */

        .line {
            height: 1px;

            background: #999;

            width: 100%;

            margin-bottom: 8px;
        }


        /* =========================
           PROGRESS TITLE
        ========================= */

        .progress-title {
            font-size: 9px;

            font-weight: 700;

            margin-bottom: 9px;
        }


        /* =========================
           VERIFICATION ITEM
        ========================= */

        .verify-item {
            height: 48px;

            display: flex;

            align-items: center;

            position: relative;
        }

        .item-icon {
            width: 31px;
            height: 31px;

            border-radius: 50%;

            background: #0794f5;

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 16px;

            margin-right: 8px;
        }

        .item-icon.gray {
            background: #a5a5a5;
        }

        .item-text {
            font-size: 8px;

            color: #111;

            white-space: nowrap;
        }


        /* =========================
           STATUS CIRCLE
        ========================= */

        .status {
            position: absolute;

            right: 0;

            width: 15px;
            height: 15px;

            border-radius: 50%;
        }

        .status.done {
            border: 1.5px solid #20a947;

            color: #20a947;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 10px;
        }

        .status.loading {
            border: 1.5px dashed #0794f5;
        }

        .status.pending {
            border: 1.5px solid #888;
        }


        /* =========================
           CURRENT STATUS
        ========================= */

        .current-status {
            border-top: 1px solid #999;

            margin-top: 2px;

            padding-top: 9px;

            text-align: center;

            color: #008cff;

            font-size: 9px;

            font-weight: 600;
        }


        /* =========================
           PROGRESS BAR
        ========================= */

        .progress-bar {
            width: 100%;
            height: 19px;

            margin-top: 8px;

            background: #858585;

            border-radius: 12px;

            overflow: hidden;
        }

        .progress-fill {
            width: 65%;
            height: 100%;

            background: #0794f5;

            border-radius: 12px;
        }


        /* =========================
           PERCENTAGE
        ========================= */

        .percentage {
            text-align: center;

            margin-top: 6px;

            color: #008cff;

            font-size: 12px;

            font-weight: 600;
        }


    </style>
</head>


<body>


    <div class="verification-screen">


        <!-- =========================
             HEADER
        ========================= -->

        <div class="header">

            <div class="brand">
                ZeroTrace
            </div>

            <div class="bell">
                <div class="bell-icon"></div>
            </div>

        </div>


        <!-- =========================
             TITLE
        ========================= -->

        <div class="title-section">

            <h1>
                Verification
            </h1>

            <p>
                Securely verify your document
            </p>

        </div>


        <!-- =========================
             VERIFICATION CARD
        ========================= -->

        <div class="verification-card">


            <!-- Shield -->

            <div class="shield"></div>


            <!-- Card Heading -->

            <div class="card-title">
                Verify Your Document
            </div>


            <!-- Description -->

            <p class="card-description">
                Your document is being checked for<br>
                authenticity and integrity
            </p>


            <div class="line"></div>


            <!-- Progress Heading -->

            <div class="progress-title">
                Verification Progress
            </div>


            <!-- =========================
                 DOCUMENT CHECK
            ========================= -->

            <div class="verify-item">

                <div class="item-icon">
                    📄
                </div>

                <div class="item-text">
                    Document authenticity check
                </div>

                <div class="status done">
                    ✓
                </div>

            </div>


            <!-- =========================
                 INTEGRITY CHECK
            ========================= -->

            <div class="verify-item">

                <div class="item-icon">
                    🛡
                </div>

                <div class="item-text">
                    Integrity check
                </div>

                <div class="status loading"></div>

            </div>


            <!-- =========================
                 FINAL VERIFICATION
            ========================= -->

            <div class="verify-item">

                <div class="item-icon gray">
                    ♙
                </div>

                <div class="item-text">
                    Final verification
                </div>

                <div class="status pending"></div>

            </div>


            <!-- =========================
                 CURRENT STATUS
            ========================= -->

            <div class="current-status">
                Verifying Your Document
            </div>


            <!-- =========================
                 PROGRESS BAR
            ========================= -->

            <div class="progress-bar">

                <div class="progress-fill"></div>

            </div>


            <!-- PERCENTAGE -->

            <div class="percentage">
                65 %
            </div>


        </div>


    </div>


</body>
</html>
