<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTrace - Age Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           MAIN SCREEN
        ========================= */

        .screen {
            width: 243px;
            height: 526px;

            position: relative;
            overflow: hidden;

            background: linear-gradient(
                180deg,
                #061526 0%,
                #0b2452 48%,
                #173d83 100%
            );

            color: white;
        }


        /* =========================
           HEADER
        ========================= */

        .logo {
            position: absolute;
            top: 18px;
            left: 18px;

            font-size: 11px;
            font-weight: 600;

            color: white;
        }

        .bell {
            position: absolute;

            top: 17px;
            right: 13px;

            width: 12px;
            height: 13px;

            border: 1.5px solid white;
            border-radius: 7px 7px 3px 3px;
        }

        .bell::before {
            content: "";

            position: absolute;

            top: -3px;
            left: 3px;

            width: 4px;
            height: 3px;

            border: 1.5px solid white;
            border-bottom: none;

            border-radius: 4px 4px 0 0;
        }

        .bell::after {
            content: "";

            position: absolute;

            bottom: -4px;
            left: 3px;

            width: 4px;
            height: 2px;

            border-radius: 50%;
            background: white;
        }


        /* =========================
           VERIFIED ICON
        ========================= */

        .verified-icon {
            position: absolute;

            top: 37px;
            left: 50%;

            transform: translateX(-50%);

            width: 80px;
            height: 80px;

            border: 5px solid #00a85a;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            animation: verificationPulse 2.5s ease-in-out infinite;
        }

        .verified-icon::before {
            content: "";

            width: 58px;
            height: 58px;

            border: 4px solid #00a85a;
            border-radius: 50%;
        }

        .check {
            position: absolute;

            width: 28px;
            height: 14px;

            border-left: 5px solid #00a85a;
            border-bottom: 5px solid #00a85a;

            transform: rotate(-45deg);

            top: 28px;
            left: 23px;

            animation: checkPulse 2.5s ease-in-out infinite;
        }


        /* =========================
           TITLE
        ========================= */

        .page-title {
            position: absolute;

            top: 126px;
            left: 0;

            width: 100%;

            margin: 0;

            text-align: center;

            font-size: 16px;
            font-weight: 400;
        }

        .subtitle {
            position: absolute;

            top: 160px;
            left: 0;

            width: 100%;

            margin: 0;

            text-align: center;

            font-size: 8px;
            color: white;
        }


        /* =========================
           OPTION A CARD
        ========================= */

        .option-a {
            position: absolute;

            top: 194px;
            left: 25px;

            width: 194px;
            height: 118px;

            border: 1px solid #65728a;
            border-radius: 6px;

            padding: 10px;

            animation: cardGlow 3s ease-in-out infinite;
        }

        .option-title {
            display: flex;
            align-items: center;

            font-size: 9px;
            color: white;
        }


        /* File icon */

        .file-icon {
            position: relative;

            width: 14px;
            height: 17px;

            margin-right: 6px;

            border: 1.5px solid white;
            border-radius: 2px;
        }

        .file-icon::after {
            content: "";

            position: absolute;

            width: 5px;
            height: 1px;

            left: 3px;
            bottom: 4px;

            background: white;

            box-shadow: 0 -3px 0 white;
        }


        .upload-text {
            margin-top: 14px;
            font-size: 9px;
        }


        /* =========================
           FILE INPUT
        ========================= */

        .file-box {
            margin-top: 12px;

            width: 161px;
            height: 39px;

            border: 1px solid #b5bfd0;
            border-radius: 6px;

            padding: 5px;
        }

        .browse {
            display: inline-block;

            padding: 6px 7px;

            border-radius: 3px;

            background: #5796ca;
            border: 1px solid #a8d0ed;

            font-size: 9px;
            color: white;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .browse:hover {
            background: #6da9d8;
            box-shadow: 0 0 10px rgba(60, 180, 255, 0.45);
        }

        .browse input {
            display: none;
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {
            position: absolute;

            top: 325px;
            left: 15px;

            width: 211px;
            height: 1px;

            background: #9ca8ba;
        }


        /* =========================
           OPTION B
        ========================= */

        .option-b {
            position: absolute;

            top: 354px;
            left: 27px;

            width: 193px;
        }

        .manual-title {
            display: flex;
            align-items: center;

            font-size: 9px;
        }


        /* Number icon */

        .number-icon {
            width: 23px;
            height: 23px;

            margin-right: 9px;

            border: 1px solid white;

            display: grid;

            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;

            font-size: 9px;
            text-align: center;
            line-height: 11px;
        }

        .number-icon span {
            border-right: 1px solid white;
            border-bottom: 1px solid white;
        }

        .number-icon span:nth-child(2),
        .number-icon span:nth-child(4) {
            border-right: none;
        }

        .number-icon span:nth-child(3),
        .number-icon span:nth-child(4) {
            border-bottom: none;
        }


        /* =========================
           AGE INPUT
        ========================= */

        .age-input {
            width: 194px;
            height: 31px;

            margin-top: 13px;

            padding: 0 12px;

            border: 1px solid #65728a;
            border-radius: 6px;

            outline: none;

            background: transparent;

            color: white;

            font-size: 9px;
        }

        .age-input:focus {
            border-color: #3bbcff;
            box-shadow: 0 0 8px rgba(30, 190, 255, 0.35);
        }


        /* =========================
           VERIFY BUTTON
        ========================= */

        .verify-button {
            position: absolute;

            top: 438px;
            left: 13px;

            width: 216px;
            height: 37px;

            border: none;
            border-radius: 5px;

            background: #0795f5;

            color: white;

            font-size: 11px;
            font-weight: 600;

            cursor: pointer;

            /* VIDEO-LIKE GLOW */
            animation: buttonGlow 2s ease-in-out infinite;

            transition: transform 0.2s ease;
        }

        .verify-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 0 8px rgba(0, 220, 255, 0.8),
                0 0 20px rgba(0, 200, 255, 0.65),
                0 0 35px rgba(0, 200, 255, 0.4);
        }

        .verify-button:active {
            transform: scale(0.98);
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes buttonGlow {

            0% {
                box-shadow:
                    0 0 3px rgba(0, 220, 255, 0.25),
                    0 0 8px rgba(0, 200, 255, 0.15);
            }

            50% {
                box-shadow:
                    0 0 8px rgba(0, 235, 255, 0.8),
                    0 0 18px rgba(0, 210, 255, 0.65),
                    0 0 30px rgba(0, 190, 255, 0.35);
            }

            100% {
                box-shadow:
                    0 0 3px rgba(0, 220, 255, 0.25),
                    0 0 8px rgba(0, 200, 255, 0.15);
            }
        }


        @keyframes verificationPulse {

            0%,
            100% {
                filter: drop-shadow(
                    0 0 2px rgba(0, 180, 100, 0.2)
                );
            }

            50% {
                filter: drop-shadow(
                    0 0 9px rgba(0, 210, 110, 0.5)
                );
            }
        }


        @keyframes checkPulse {

            0%,
            100% {
                opacity: 0.85;
            }

            50% {
                opacity: 1;
            }
        }


        @keyframes cardGlow {

            0%,
            100% {
                box-shadow:
                    0 0 0 rgba(0, 180, 255, 0);
            }

            50% {
                box-shadow:
                    0 0 12px rgba(0, 170, 255, 0.12);
            }
        }

    </style>
</head>


<body>

    <div class="screen">

        <!-- HEADER -->

        <div class="logo">
            ZeroTrace
        </div>

        <div class="bell"></div>


        <!-- VERIFIED ICON -->

        <div class="verified-icon">
            <div class="check"></div>
        </div>


        <!-- TITLE -->

        <h1 class="page-title">
            Age Verification Portal
        </h1>

        <p class="subtitle">
            Scan your ID locally or enter your details
        </p>


        <!-- OPTION A -->

        <div class="option-a">

            <div class="option-title">

                <div class="file-icon"></div>

                <span>
                    Option A: Scan a government ID
                </span>

            </div>

            <div class="upload-text">
                Upload an image of your ID
            </div>

            <div class="file-box">

                <label class="browse">
                    Browse...
                    <input type="file">
                </label>

            </div>

        </div>


        <!-- DIVIDER -->

        <div class="divider"></div>


        <!-- OPTION B -->

        <div class="option-b">

            <div class="manual-title">

                <div class="number-icon">
                    <span>1</span>
                    <span>2</span>
                    <span>3</span>
                    <span>4</span>
                </div>

                <span>
                    Option B: Manual Age Input
                </span>

            </div>

            <input
                class="age-input"
                type="number"
                value="22"
                min="1"
                placeholder="Age"
            >

        </div>


        <!-- VERIFY BUTTON -->

        <button class="verify-button">
            Generate &amp; Verify ZKP
        </button>

    </div>

</body>
</html>
