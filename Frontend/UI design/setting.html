<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTrace Settings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* =========================
           SETTINGS SCREEN
        ========================= */

        .settings-screen {
            width: 245px;
            height: 528px;
            position: relative;

            background: linear-gradient(
                180deg,
                #061525 0%,
                #0b2149 55%,
                #173a7c 100%
            );

            color: white;
            overflow: hidden;
        }

        /* =========================
           TOP HEADER
        ========================= */

        .header {
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 13px;
        }

        .brand {
            font-size: 12px;
            font-weight: 500;
        }

        /* Bell */

        .bell {
            width: 18px;
            height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .bell svg {
            width: 16px;
            height: 16px;
        }

        /* =========================
           SETTINGS CONTENT
        ========================= */

        .content {
            position: absolute;

            top: 105px;
            left: 0;

            width: 100%;

            text-align: center;
        }

        .content h1 {
            margin: 0;

            font-size: 16px;
            font-weight: 700;
        }

        .subtitle {
            margin: 8px 0 0;

            font-size: 9px;
            color: #8994a9;
        }

        /* =========================
           SETTINGS OPTIONS
        ========================= */

        .settings-list {
            margin-top: 40px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .setting-btn {
            width: 174px;
            height: 40px;

            margin-bottom: 18px;

            border: none;
            border-radius: 9px;

            background: white;
            color: #687993;

            display: flex;
            align-items: center;

            padding: 0 16px;

            font-size: 9px;
            font-weight: 600;

            cursor: pointer;

            text-align: left;
        }

        .setting-btn .icon {
            width: 25px;

            font-size: 13px;

            text-align: center;

            margin-right: 8px;
        }

        .setting-btn:hover {
            background: #f0f2f5;
        }

        /* =========================
           BOTTOM NAVIGATION
        ========================= */

        .bottom-nav {
            position: absolute;

            left: 21px;
            right: 11px;
            bottom: 12px;

            height: 40px;

            background: #102b59;

            border-radius: 12px;

            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Navigation Items */

        .nav-item {
            width: 40px;
            height: 34px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            color: #dce4f2;

            font-size: 12px;

            cursor: pointer;

            position: relative;
        }

        .nav-item span {
            font-size: 7px;
            margin-top: 2px;
            line-height: 8px;
        }

        /* Active Settings */

        .nav-item.active {
            color: white;
        }

        .nav-item.active::before {
            content: "";

            position: absolute;

            top: -1px;

            width: 8px;
            height: 2px;

            background: #9b5cff;

            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="settings-screen">

        <!-- =========================
             HEADER
        ========================= -->

        <div class="header">

            <div class="brand">
                ZeroTrace
            </div>

            <!-- Bell Icon -->

            <div class="bell">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M18 9C18 5.69 15.76 3 12 3C8.24 3 6 5.69 6 9C6 14 4 15 4 17H20C20 15 18 14 18 9Z"
                        stroke="white"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M10 20H14"
                        stroke="white"
                        stroke-width="1.7"
                        stroke-linecap="round"
                    />

                </svg>

            </div>

        </div>


        <!-- =========================
             SETTINGS CONTENT
        ========================= -->

        <div class="content">

            <h1>
                Settings
            </h1>

            <p class="subtitle">
                Manage your ZeroTrace preferences
            </p>


            <!-- Settings Options -->

            <div class="settings-list">

                <!-- Account Settings -->

                <button class="setting-btn">
                    <span class="icon">⚙️</span>
                    <span>Account Settings &nbsp; &gt;</span>
                </button>


                <!-- Notifications -->

                <button class="setting-btn">
                    <span class="icon">🔔</span>
                    <span>Notifications</span>
                </button>


                <!-- Privacy -->

                <button class="setting-btn">
                    <span class="icon">🔒</span>
                    <span>Privacy &amp; Security</span>
                </button>


                <!-- About -->

                <button class="setting-btn">
                    <span class="icon">ⓘ</span>
                    <span>About ZeroTrace</span>
                </button>

            </div>

        </div>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================= -->

        <div class="bottom-nav">

            <!-- Home -->

            <div class="nav-item">
                🏠
            </div>


            <!-- Security -->

            <div class="nav-item">
                🛡️
            </div>


            <!-- Verification -->

            <div class="nav-item">
                👁️
            </div>


            <!-- Settings -->

            <div class="nav-item active">
                ⚙️
                <span>Settings</span>
            </div>

        </div>

    </div>

</body>
</html>
