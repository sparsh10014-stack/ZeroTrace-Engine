<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTrace - Onboarding 2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           MAIN SCREEN
        ========================= */

        .screen {
            width: 243px;
            height: 526px;

            position: relative;
            overflow: hidden;

            background: linear-gradient(
                180deg,
                #061526 0%,
                #0a2048 50%,
                #173b80 100%
            );

            color: white;
        }

        /* =========================
           SHIELD
        ========================= */

        .shield {
            position: absolute;

            top: 158px;
            left: 50%;

            transform: translateX(-50%);

            width: 82px;
            height: 94px;

            background: linear-gradient(
                145deg,
                #ffffff 0%,
                #d0d0d0 100%
            );

            clip-path: polygon(
                18% 8%,
                32% 14%,
                50% 8%,
                68% 14%,
                82% 8%,

                92% 24%,
                88% 42%,
                91% 57%,

                86% 68%,
                74% 76%,
                60% 82%,
                50% 88%,

                40% 82%,
                26% 76%,
                14% 68%,
                9% 57%,

                12% 42%,
                8% 24%
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           LOCK
        ========================= */

        .lock {
            position: relative;

            width: 14px;
            height: 13px;

            background: white;
            border-radius: 2px;

            margin-top: 3px;
        }

        .lock::before {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            left: 1px;
            top: -7px;

            border: 2px solid white;
            border-bottom: none;

            border-radius: 8px 8px 0 0;
        }

        /* =========================
           TITLE
        ========================= */

        .title {
            position: absolute;

            top: 267px;
            left: 0;

            width: 100%;

            margin: 0;

            text-align: center;

            font-size: 14px;
            font-weight: 700;

            color: #ffffff;
        }

        /* =========================
           DESCRIPTION
        ========================= */

        .description {
            position: absolute;

            top: 294px;
            left: 0;

            width: 100%;

            padding: 0 25px;
            margin: 0;

            text-align: center;

            font-size: 8px;
            line-height: 10px;

            color: #d8deeb;
        }

        /* =========================
           PROGRESS DOTS
        ========================= */

        .dots {
            position: absolute;

            top: 342px;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 10px;
        }

        .dot {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #65728a;
        }

        .dot.active {
            background: #ffffff;
        }

        /* =========================
           NEXT BUTTON
        ========================= */

        .next-button {
            position: absolute;

            top: 360px;
            left: 50%;

            transform: translateX(-50%);

            width: 159px;
            height: 28px;

            border: none;
            border-radius: 7px;

            background: #ffffff;

            color: #07172e;

            font-size: 9px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .next-button:hover {
            background: #eef1f6;
        }

        .next-button:active {
            transform: translateX(-50%) scale(0.98);
        }

    </style>
</head>

<body>

    <div class="screen">

        <!-- SHIELD + LOCK -->
        <div class="shield">
            <div class="lock"></div>
        </div>

        <!-- TITLE -->
        <h1 class="title">
            Stay Safe From Digital Threats
        </h1>

        <!-- DESCRIPTION -->
        <p class="description">
            Detect and prevent online threats<br>
            before they reach you.
        </p>

        <!-- PROGRESS DOTS -->
        <div class="dots">
            <div class="dot"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>

        <!-- NEXT BUTTON -->
        <button class="next-button">
            Next →
        </button>

    </div>

</body>
</html>
